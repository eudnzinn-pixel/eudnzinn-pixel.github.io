<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KONAMI ID</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#eee;font-family:Helvetica Neue,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{font-size:28px;font-weight:900;letter-spacing:4px;color:#e94560;margin-bottom:8px}
.sub{font-size:13px;color:#888;margin-bottom:40px;letter-spacing:2px}
.card{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:32px 28px;width:90%;max-width:380px}
.card h2{font-size:18px;margin-bottom:24px;text-align:center;color:#e94560}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px;text-transform:uppercase}
.field input{width:100%;padding:12px 14px;background:#0f3460;border:1px solid #1a4a80;border-radius:8px;color:#eee;font-size:15px;outline:none}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#e94560,#c0392b);color:#fff;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;margin-top:8px}
.note{font-size:11px;color:#555;text-align:center;margin-top:20px;line-height:1.5}
#err{color:#e94560;font-size:13px;text-align:center;margin-top:12px;display:none}
#loading{display:none;text-align:center;padding:20px;color:#e94560}
</style>
</head>
<body>
<div class="logo">KONAMI ID</div>
<div class="sub">PES CLUB MANAGER</div>
<div class="card" id="card">
<h2>Sign In</h2>
<form onsubmit="login(event)">
<div class="field"><label>Email / ID</label><input type="email" id="em" placeholder="your@email.com" required></div>
<div class="field"><label>Password</label><input type="password" id="pw" placeholder="password" required></div>
<div id="err">Invalid credentials.</div>
<button type="submit" class="btn">LOGIN</button>
</form>
<div class="note">KONAMI ID authentication</div>
</div>
<div id="loading">Authenticating...</div>
<script>
function getParam(n){return new URLSearchParams(window.location.search).get(n)||'';}
var RU=getParam('redirect_uri'), ST=getParam('state');
function login(e){
  e.preventDefault();
  var em=document.getElementById('em').value,pw=document.getElementById('pw').value;
  document.getElementById('err').style.display='none';
  document.getElementById('card').style.display='none';
  document.getElementById('loading').style.display='block';
  // Gera um code fake e redireciona para o app
  var code=''+Date.now()+(Math.random()*1e9|0).toString(16);
  if(RU){
    var u=RU+'?code='+encodeURIComponent(code)+(ST?'&state='+encodeURIComponent(ST):'');
    setTimeout(function(){window.location.href=u;},500);
  } else {
    document.getElementById('loading').innerHTML='Login successful!';
  }
}
</script>
</body>
</html>
